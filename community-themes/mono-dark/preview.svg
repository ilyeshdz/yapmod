  <text x="396" y="372" fill="#696969" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">$</text>
  <text x="412" y="372" fill="#f5f5f5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">cat mono-dark.css</text>
  <text x="396" y="398" fill="#a3a3a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">--ym-bg-main: #0a0a0a;</text>
  <text x="396" y="420" fill="#a3a3a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">--ym-text: #f5f5f5;</text>
  <text x="396" y="442" fill="#a3a3a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">--ym-accent: #ffffff;</text>

  <!-- message 3 -->
  <circle cx="346" cy="514" r="17" fill="#111111" stroke="#ffffff" stroke-opacity="0.16"/>
  <text x="339" y="520" fill="#f5f5f5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">+</text>
  <text x="376" y="512" fill="#f5f5f5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">accent</text>
  <text x="448" y="512" fill="#696969" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">today at 20:33</text>
  <rect x="376" y="530" width="164" height="34" rx="4" fill="#e8e1d2"/>
  <text x="396" y="552" fill="#000000" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">beige on black</text>

  <!-- composer -->
  <rect x="328" y="648" width="552" height="48" rx="4" fill="#0d0d0d" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="348" y="677" fill="#696969" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Message #general</text>
  <rect x="830" y="659" width="34" height="26" rx="3" fill="#e8e1d2"/>
  <path d="M840 672h14m-6-6 6 6-6 6" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

