<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 0) rotate(90) scale(520 760)">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="0.55" stop-color="#080808"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#000000"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- outer frame -->
  <rect x="72" y="72" width="1056" height="656" rx="10" fill="#050505" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- rail -->
  <rect x="72" y="72" width="220" height="656" rx="10" fill="#000000"/>
  <path d="M292 72V728" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="112" cy="116" r="18" fill="#111111" stroke="#ffffff" stroke-opacity="0.18"/>
  <path d="M105 116h14M112 109v14" stroke="#f5f5f5" stroke-width="1.5" stroke-linecap="round"/>
  <text x="144" y="122" fill="#f5f5f5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">mono-dark</text>

  <text x="104" y="190" fill="#696969" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2">CHANNELS</text>
