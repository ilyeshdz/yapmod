  <text x="944" y="366" fill="#f5f5f5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">nopqrstuvwxyz</text>
  <text x="944" y="390" fill="#a3a3a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">ABCDEFGHIJKLM</text>
  <text x="944" y="414" fill="#a3a3a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">NOPQRSTUVWXYZ</text>

