  <text x="328" y="124" fill="#f5f5f5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700">Mono Dark</text>
  <text x="328" y="150" fill="#696969" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">black surfaces · white accent · monospace only</text>
  <path d="M292 176H912" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- message 1 -->
  <circle cx="346" cy="222" r="17" fill="#111111" stroke="#ffffff" stroke-opacity="0.16"/>
  <text x="339" y="228" fill="#f5f5f5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">M</text>
  <text x="376" y="220" fill="#f5f5f5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">mono</text>
  <text x="430" y="220" fill="#696969" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">today at 20:31</text>
  <text x="376" y="245" fill="#a3a3a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">Black is not a colour. It is a policy.</text>
  <text x="376" y="268" fill="#a3a3a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">Every surface is monospace now.</text>

