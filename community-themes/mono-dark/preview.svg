  <rect x="912" y="72" width="216" height="656" rx="10" fill="#050505"/>
  <path d="M912 72V728" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="944" y="124" fill="#696969" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2">SPECIMEN</text>
  <text x="944" y="196" fill="#f5f5f5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="72" font-weight="700">Aa</text>
  <text x="944" y="230" fill="#a3a3a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">JetBrains Mono</text>
  <text x="944" y="252" fill="#696969" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">variable · 100–800</text>

  <path d="M944 286H1096" stroke="#ffffff" stroke-opacity="0.1"/>
