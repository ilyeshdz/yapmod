name: Deploy website

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'community-themes/**'
      - '.github/workflows/web.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir web install --frozen-lockfile --ignore-workspace

      - name: Check and build website
        run: pnpm check:web

      - name: Preserve published client updates
        env:
          CLIENT_UPDATES_URL: https://ilyeshdz.github.io/yapmod/client-updates
        run: |
          set -euo pipefail

          client_updates_dir="$RUNNER_TEMP/yapmod-client-updates"
          mkdir -p "$client_updates_dir"

          manifest_status=$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --header 'Cache-Control: no-cache' \
            --output "$client_updates_dir/manifest.json" \
            --write-out '%{http_code}' \
            "$CLIENT_UPDATES_URL/manifest.json")

          case "$manifest_status" in
            200)
              for asset in manifest.sig bundle.json; do
                asset_status=$(curl --silent --show-error --location \
                  --connect-timeout 10 --max-time 30 \
                  --header 'Cache-Control: no-cache' \
                  --output "$client_updates_dir/$asset" \
                  --write-out '%{http_code}' \
                  "$CLIENT_UPDATES_URL/$asset")
                if [ "$asset_status" != "200" ]; then
                  echo "Could not preserve client update asset $asset (HTTP $asset_status)" >&2
                  exit 1
                fi
              done

              mkdir -p web/dist/client-updates
              cp "$client_updates_dir/manifest.json" \
                "$client_updates_dir/manifest.sig" \
                "$client_updates_dir/bundle.json" \
                web/dist/client-updates/
              ;;
            404)
              echo "No published client update manifest found; continuing without one."
              ;;
            *)
              echo "Could not check the published client update manifest (HTTP $manifest_status)" >&2
              exit 1
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
