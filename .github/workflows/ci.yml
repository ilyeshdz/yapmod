name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install modules
        run: pnpm install --frozen-lockfile

      - name: Test release tooling
        run: pnpm test:scripts

      - name: Check and build the client
        run: pnpm check:client

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          rustflags: ''

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Rustfmt check
        run: pnpm check:rust:format

  rust:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
          rustflags: ''
          cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Prepare apt archive cache
        if: matrix.platform == 'ubuntu-latest'
        id: apt-cache
        run: |
          . /etc/os-release
          echo "release=${VERSION_ID}" >> "$GITHUB_OUTPUT"
          mkdir -p "$HOME/apt-archives/partial"

      - name: Cache apt archives
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ steps.apt-cache.outputs.release }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ steps.apt-cache.outputs.release }}-${{ runner.arch }}-

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$source" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y \
            -o Dir::Cache::Archives="$HOME/apt-archives" \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev
          sudo chown -R "$USER" "$HOME/apt-archives"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install modules and build client bundles
        run: pnpm install --frozen-lockfile && pnpm client:build

      - name: Clippy check
        run: pnpm check:rust:clippy

      - name: Check the generated types
        run: pnpm check:types

  website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir web install --frozen-lockfile --ignore-workspace

      - name: Check and build the website
        run: pnpm check:web
