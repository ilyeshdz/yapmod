name: Publish client update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel to publish
        required: true
        type: choice
        default: stable
        options:
          - stable
          - nightly
      ref:
        description: Git ref to build (defaults to main for stable and nightly for nightly)
        required: false
        type: string
        default: ''
      release_sequence:
        description: Optional release sequence (defaults to the next published value)
        required: false
        type: string
        default: ''
      min_app_version:
        description: Optional minimum compatible Yapmod version (defaults to the app version in Cargo.toml)
        required: false
        type: string
        default: ''
      expires_at:
        description: Optional manifest expiry as Unix seconds (defaults to 60 days)
        required: false
        type: string
        default: ''
      dry_run:
        description: Build and validate without deploying
        required: false
        type: boolean
        default: false
  release:
    types:
      - published

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name != 'release' ||
      (github.event.release.prerelease == false && github.event.release.tag_name != 'nightly')
    uses: ./.github/workflows/publish-client.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      channel: ${{ github.event_name == 'release' && 'stable' || inputs.channel }}
      ref: >-
        ${{ github.event_name == 'release' && github.event.release.tag_name ||
            (inputs.ref != '' && inputs.ref ||
             (inputs.channel == 'nightly' && 'nightly' || 'main')) }}
      release_sequence: ${{ inputs.release_sequence }}
      min_app_version: ${{ inputs.min_app_version }}
      expires_at: ${{ inputs.expires_at }}
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
